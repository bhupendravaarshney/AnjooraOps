services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: anjoora
      POSTGRES_USER: anjoora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - anjoora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anjoora -d anjoora"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DEPLOYMENT_PROFILE: local
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  scheduler:
    build: .
    env_file: .env
    environment:
      APP_URL: http://app:3000
      DEPLOYMENT_PROFILE: local
    working_dir: /app/web
    command: ["node", "scripts/schedule-jobs.mjs"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  anjoora_pg:
